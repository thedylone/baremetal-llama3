# The page lives on the project-page branch. Pushes there start this workflow through
# project-page's .github/workflows/pages-trigger.yml.
# The build, kit header/footer injection and deploy live in thedylone/style.
name: Deploy project page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: thedylone/style/.github/workflows/pages.yml@main
    with:
      site: docs
      ref: project-page
